# Curated label set for Yuhi.
# Apply with:  bash scripts/apply-labels.sh   (uses gh; --force updates existing)
# Format is compatible with EndBug/label-sync and similar tools.

# ── Type ───────────────────────────────────────────────
- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"
- name: "enhancement"
  color: "a2eeef"
  description: "New feature or request"
- name: "documentation"
  color: "0075ca"
  description: "Docs, examples, or website"
- name: "question"
  color: "d876e3"
  description: "A question or support request"
- name: "research"
  color: "8256d0"
  description: "Context preparation research / ContextBench"
- name: "benchmark"
  color: "5319e7"
  description: "ContextBench tasks, datasets, metrics"
- name: "processor"
  color: "c5a3ff"
  description: "A Prepare-locally processor"

# ── Area ───────────────────────────────────────────────
- name: "area:cli"
  color: "1d76db"
  description: "The yuhi CLI"
- name: "area:vscode"
  color: "1d76db"
  description: "The VS Code extension"
- name: "area:policy"
  color: "1d76db"
  description: "Policy engine (globs, precedence, detectors)"
- name: "area:scanner"
  color: "1d76db"
  description: "Secret detection / scanning"
- name: "area:workspace"
  color: "1d76db"
  description: "Workspace materialization"
- name: "area:core"
  color: "1d76db"
  description: "Core runtime / route executor"
- name: "area:website"
  color: "1d76db"
  description: "The landing page (site/)"

# ── Community & workflow ───────────────────────────────
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is welcome"
- name: "triage"
  color: "ededed"
  description: "Needs initial review"
- name: "needs-repro"
  color: "fbca04"
  description: "Awaiting a minimal reproduction"
- name: "blocked"
  color: "b60205"
  description: "Blocked on another issue or decision"

# ── Meta ───────────────────────────────────────────────
- name: "security"
  color: "b60205"
  description: "Security-relevant (use private reporting for vulnerabilities)"
- name: "breaking-change"
  color: "d93f0b"
