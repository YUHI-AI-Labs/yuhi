blank_issues_enabled: false
contact_links:
  - name: Questions & Discussions
    url: https://github.com/YUHI-AI-Labs/yuhi/discussions
    about: >
      Have a question, an idea, or want to show what you built? Please use
      GitHub Discussions (Q&A, Ideas, Show and tell) instead of opening an issue.
  - name: Report a security vulnerability (private)
    url: https://github.com/YUHI-AI-Labs/yuhi/security/advisories/new
    about: >
      Do NOT open a public issue for security problems. Use the repository's
      Security tab → "Report a vulnerability" to report privately via GitHub
      Security Advisories. See docs/SECURITY.md for scope.
