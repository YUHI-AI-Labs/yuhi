version: 2
updates:
  # JavaScript / TypeScript dependencies (pnpm monorepo).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    ignore:
      # Defer major version bumps during the beta; revisit these deliberately,
      # not as drive-by PRs. Minor/patch updates are grouped below.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    groups:
      # Group minor/patch bumps to keep PR noise down.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions workflow dependencies.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    ignore:
      # Same rule the npm ecosystem already had: a major bump of an action can
      # change runner behaviour or drop inputs, so it gets reviewed on purpose
      # rather than arriving as six drive-by PRs. Revisit deliberately —
      # github/codeql-action in particular stops being supported on old majors.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
