name: Secret Scan

# Scans the repository for accidentally committed secrets using gitleaks.
# Yuhi's whole premise is keeping secrets away from agents, so we hold our own
# repo to the same standard.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full-history scan, Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so scheduled scans can inspect past commits.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # No org license key is required for public repositories.
          # GITLEAKS_LICENSE is only needed for private/org use and is optional.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
